# CI: HMG-API's reusable mod workflow (the "hmgapi" floor and hook points, build, test.sh,
# check-scripts, and packaging with a throwaway key), pinned to the official Open-HMG SDK.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The workflow and hmgapi-sdk.json pin the same HMG-API
        run: |
          w=$(sed -n 's#^ *uses: Open-HMG/HMG-API/.github/workflows/mod.yml@\([0-9A-Za-z.-]*\)$#\1#p' .github/workflows/ci.yml)
          s=$(python3 -c 'import json; p=json.load(open("hmgapi-sdk.json")); print(p.get("ref") or "v"+p["version"])')
          test "$w" = "$s" || { echo "ci.yml calls mod.yml@$w, hmgapi-sdk.json pins $s"; exit 1; }

  mod:
    uses: Open-HMG/HMG-API/.github/workflows/mod.yml@v1.1.0-rc.3
